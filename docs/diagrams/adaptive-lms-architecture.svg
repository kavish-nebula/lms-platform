h="2"/><rect x="1130" y="970" width="500" height="165" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#183047"><tspan x="70" y="67.3">Adaptive LMS | Current architecture</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#52677d"><tspan x="70" y="115">Technology stack and service boundaries — local deployment</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="96" y="213.28">Learner browser</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="96" y="258.08">React 19 + Next.js interface</tspan><tspan x="96" y="289.36">Profiling, lessons and assessments</tspan><tspan x="96" y="320.64">localStorage: playback + retry queue</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="1106" y="213.28">Google Gemini</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#334a60"><tspan x="1106" y="273.36">Configured OpenAI-compatible API</tspan><tspan x="1106" y="306">Profiling, planning and slide rewriting</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="96" y="538.28">Next.js backend | port 3002</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#334a60"><tspan x="96" y="624.5">Node.js + TypeScript + Zod + Drizzle</tspan><tspan x="96" y="658.5">Profile and enrollment interviews</tspan><tspan x="96" y="692.5">Server grading, plans and evidence</tspan><tspan x="96" y="726.5">Versioned jobs, SSE and audio delivery</tspan><tspan x="96" y="760.5">Authentication: shared demo learner</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="1026" y="538.28">Python adaptive services | port 8001</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#334a60"><tspan x="1026" y="624.5">Worker: claims, leases and heartbeats</tspan><tspan x="1026" y="658.5">FastAPI + Pydantic + httpx</tspan><tspan x="1026" y="692.5">Adaptive teaching prompt version 4</tspan><tspan x="1026" y="726.5">LLM rewriting + structure validation</tspan><tspan x="1026" y="760.5">Returns generated text to Next.js</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="96" y="1018.28">PGlite database</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#334a60"><tspan x="96" y="1059.12">Profiles, plans, progress and signals</tspan><tspan x="96" y="1089.04">Evidence summaries + durable jobs</tspan><tspan x="96" y="1118.9599999999998">PostgreSQL via DATABASE_URL optional</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="626" y="1018.28">Speech + audio files</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#334a60"><tspan x="626" y="1059.12">Kokoro: Node-managed subprocess</tspan><tspan x="626" y="1089.04">Generated WAV files on local disk</tspan><tspan x="626" y="1118.9599999999998">Cloud speech also supported</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="1156" y="1018.28">Authored JSON content</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="1156" y="1073.72">Original lessons and slide structure</tspan><tspan x="1156" y="1105">Questions, objectives and standards</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#41566b"><tspan x="340" y="402.44">HTTP / JSON</tspan><tspan x="340" y="431">Answers + requests</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#41566b"><tspan x="640" y="372.44">SSE updates</tspan><tspan x="640" y="401">+ audio responses</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#41566b"><tspan x="920" y="372.44">Profiling questions</tspan><tspan x="920" y="401">+ learning plans</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#41566b"><tspan x="750" y="645.3">Authenticated job API</tspan><tspan x="750" y="672.5">Claim / heartbeat / result</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#41566b"><tspan x="1350" y="402.44">Slide + narration</tspan><tspan x="1350" y="431">text generation</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#41566b"><tspan x="310" y="892.44">Learner records</tspan><tspan x="310" y="921">+ revision status</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#41566b"><tspan x="620" y="881.4">Generate matching narration</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#41566b"><tspan x="1140" y="848.9">Authored source teaching</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#52677d"><tspan x="70" y="1172.72">Current setup: local processes and disk storage. Google Cloud production infrastructure is planned, not deployed.</tspan></text></svg>