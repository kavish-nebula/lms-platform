<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1200" viewBox="0 0 1700 1200"><rect width="1700" height="1200" fill="white"/><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#52677d"/></marker></defs><polyline points="310,425 310,500" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="90,555 35,555 35,345 90,345" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="310,655 310,730" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="530,815 575,815 575,345 630,345" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="850,425 850,500" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="850,655 850,730" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1070,815 1120,815 1120,345 1170,345" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1390,425 1390,500" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><polyline points="1390,655 1390,730" fill="none" stroke="#52677d" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="90" y="270" width="440" height="155" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="90" y="500" width="440" height="155" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="90" y="730" width="440" height="170" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><rect x="630" y="270" width="440" height="155" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><rect x="630" y="500" width="440" height="155" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><rect x="630" y="730" width="440" height="170" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><rect x="1170" y="270" width="440" height="155" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><rect x="1170" y="500" width="440" height="155" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><rect x="1170" y="730" width="440" height="170" rx="18" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#183047"><tspan x="70" y="67.3">How profiling changes Module 1 and Module 2</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#52677d"><tspan x="70" y="115">One learner context, two AI paths, and a verified performance loop</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#2563eb"><tspan x="90" y="211.92">1  User profiling</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#7c3aed"><tspan x="630" y="211.92">2  Personalise Module 1</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0f766e"><tspan x="1170" y="211.92">3  Adapt Module 2</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="116" y="318.28">Answer a question</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="116" y="368.72">Choose an option or type your own</tspan><tspan x="116" y="400">answer in the profiling chat.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="116" y="548.28">Generate the next question</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="116" y="598.72">Next.js sends the conversation</tspan><tspan x="116" y="630">and missing facts to the LLM.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="116" y="778.28">Save learner context</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="116" y="820.58">Subject, experience and preferences</tspan><tspan x="116" y="851.86">Plus enrollment goal and focus</tspan><tspan x="116" y="883.1400000000001">Saved in PGlite by Next.js</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="656" y="318.28">Prepare Module 1 jobs</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="656" y="368.72">Profile + enrollment answers</tspan><tspan x="656" y="400">+ learning plan + original content</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="656" y="548.28">Rewrite, validate and speak</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="656" y="598.72">Python + Gemini rewrite the slide.</tspan><tspan x="656" y="630">Next.js validates and runs speech.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="656" y="778.28">Deliver Module 1</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="656" y="820.58">Ready revision announced via SSE</tspan><tspan x="656" y="851.86">Slide + audio at safe boundaries</tspan><tspan x="656" y="883.1400000000001">Help requests can trigger a rewrite.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="1196" y="318.28">Verify Module 1 answers</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="1196" y="368.72">Next.js grades checks, scenarios</tspan><tspan x="1196" y="400">and module quiz responses.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="1196" y="548.28">Summarise and queue</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="1196" y="598.72">Verified attempts, correct answers</tspan><tspan x="1196" y="630">and misses update support.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#142d45"><tspan x="1196" y="778.28">Prepare Module 2</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#334a60"><tspan x="1196" y="820.58">Same AI + validation + speech path</tspan><tspan x="1196" y="851.86">Add relevant prerequisite reminders.</tspan><tspan x="1196" y="883.1400000000001">Deliver matching slide and audio.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#41566b"><tspan x="335" y="451.02">Repeat for each</tspan><tspan x="335" y="475.5">relevant question</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#183047"><tspan x="90" y="996.14">What drives adaptation?</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#334a60"><tspan x="90" y="1035.04">Module 1: profile + enrollment context; help requests and wrong answers can trigger a new explanation.</tspan><tspan x="90" y="1067.68">Module 2: the same context plus verified Module 1 evidence and authored prerequisite definitions.</tspan><tspan x="90" y="1100.32">Playback time and replays are recorded as context; they are not proof of mastery.</tspan></text><text font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#52677d"><tspan x="90" y="1163.9">Learning objectives, assessment standards and the final assessment remain authored. | Existing implementation • 21 October 2026</tspan></text></svg>